name: API

on:
  push:
    branches: [main]
    paths: ["api/**", "prompts/**", "evals/**", "data/questoes-mvp.json", ".dockerignore", ".github/workflows/api.yml"]
  # em todo PR, para poder ser obrigatório no merge
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --config pyproject.toml . ../evals
      - name: Formatação
        run: ruff format --check --config pyproject.toml . ../evals
      - name: Testes
        run: python -m pytest -q
      - name: Dependências da API sem falhas conhecidas
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  api-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Constrói a imagem
        run: docker build -f api/Dockerfile -t pista-api .
      - name: Sobe o container
        run: docker run -d --name pista -p 8000:8000 pista-api
      - name: Espera ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs pista
          exit 1
      - name: Confere as rotas
        run: |
          set -e
          esperado=$(python3 -c 'import json; print(len(json.load(open("data/questoes-mvp.json", encoding="utf-8"))))')
          curl -fs localhost:8000/health | grep -q "\"questoes\":$esperado"
          curl -fs localhost:8000/docs > /dev/null
          # a URL da fonte contém "provas_e_gabaritos", então a checagem olha as chaves do JSON
          curl -fs localhost:8000/questoes/2022-141 | python3 -c 'import json,sys; q=json.load(sys.stdin); assert "gabarito" not in q and all(set(a)=={"letra","texto"} for a in q["alternativas"]), "a rota de questão expôs o gabarito"'
          sessao=$(curl -fs -X POST localhost:8000/sessoes -H 'Content-Type: application/json' -d '{"questao_id":"2022-141"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fs -X POST "localhost:8000/sessoes/$sessao/respostas" -H 'Content-Type: application/json' -d '{"alternativa":"D"}' | grep -q '"estado":"pista_1"'
          # as migrações rodaram dentro do container: dá para criar uma conta
          token=$(curl -fs -X POST localhost:8000/contas -H 'Content-Type: application/json' -d '{"apelido":"teste_ci","senha":"senha-do-ci-123"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fs localhost:8000/eu/progresso -H "Authorization: Bearer $token" | grep -q '"total_de_questoes":0'
      - name: Confere que roda sem privilégios
        run: test "$(docker exec pista id -u)" = "1000"
