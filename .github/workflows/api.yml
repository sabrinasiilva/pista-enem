name: API

on:
  push:
    branches: [main]
    paths: ["api/**", "prompts/**", "evals/**", "data/questoes-mvp.json", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "prompts/**", "evals/**", "data/questoes-mvp.json", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --config pyproject.toml . ../evals
      - name: Formatação
        run: ruff format --check --config pyproject.toml . ../evals
      - name: Testes
        run: python -m pytest -q
