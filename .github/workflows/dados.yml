name: Dados

on:
  push:
    branches: [main]
    paths: ["data/**", ".github/workflows/dados.yml"]
  # em todo PR, para poder ser obrigatório no merge
  pull_request:

permissions:
  contents: read

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - run: pip install -r data/requirements.txt
      - name: Valida as revisões
        run: for arquivo in data/anotacoes/revisao/*.json; do python data/validar_revisao.py "$arquivo"; done
      - name: Testes
        run: python -m pytest data/tests -q
