name: CodeQL

# Análise estática de segurança do código da API (Python) e do site (TypeScript).
# Os alertas aparecem em Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"  # toda segunda, para pegar regras novas mesmo sem mudança no código

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analise:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linguagem: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguagem }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.linguagem }}
