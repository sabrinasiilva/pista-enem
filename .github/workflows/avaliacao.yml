name: Avaliação

# Roda a avaliação do tutor e o juiz automático com a chave do segredo GEMINI_API_KEY.
# Só roda quando alguém pede (Actions → Avaliação → Run workflow), porque gasta cota da IA.
on:
  workflow_dispatch:
    inputs:
      casos:
        description: Conjunto de casos
        type: choice
        options: [casos-120.json, casos.json]
        default: casos-120.json
      rotulo:
        description: "Nome da rodada no relatório, por exemplo tutor_v2"
        default: tutor_v2
      juiz:
        description: Rodar também o juiz automático
        type: boolean
        default: true
      julgar_execucao:
        description: "Só o juiz: número de uma execução anterior (o tutor não roda de novo)"
        default: ""
  # Agendamento único: 20/11 às 5h30 de Brasília (8h30 UTC), logo depois de a cota diária do Gemini
  # renovar, para julgar os 120 casos da execução 44326297246. Remover depois dessa rodada.
  schedule:
    - cron: "30 8 20 11 *"

permissions:
  contents: read
  actions: read

jobs:
  avaliacao:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # no agendamento não há inputs: roda só o juiz sobre a rodada de 120 casos
      CASOS: ${{ inputs.casos || 'casos-120.json' }}
      ROTULO: ${{ inputs.rotulo || 'tutor_v2-120' }}
      RODAR_JUIZ: ${{ github.event_name == 'schedule' || inputs.juiz }}
      JULGAR_EXECUCAO: ${{ inputs.julgar_execucao || (github.event_name == 'schedule' && '44326297246' || '') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Confere a chave
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Cadastre o segredo GEMINI_API_KEY em Settings → Secrets and variables → Actions"; exit 1; }
      - name: Tutor (casos da avaliação)
        id: tutor
        if: env.JULGAR_EXECUCAO == ''
        # vazamento faz o script sair com erro, mas o relatório e o juiz ainda precisam rodar
        run: |
          set +e
          python evals/rodar.py --local --casos "evals/$CASOS" --rotulo "$ROTULO" --intervalo 4 | tee saida.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          grep '^RELATORIO_JSON=' saida.txt | cut -d= -f2 | sed 's/^/relatorio=/' >> "$GITHUB_OUTPUT"
      - name: Relatório de uma execução anterior
        if: env.JULGAR_EXECUCAO != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.JULGAR_EXECUCAO }}
          github-token: ${{ github.token }}
          path: evals/relatorios/
          merge-multiple: true
      - name: Escolhe o relatório
        id: rel
        if: always()
        run: |
          if [ -n "${{ steps.tutor.outputs.relatorio }}" ]; then
            echo "relatorio=${{ steps.tutor.outputs.relatorio }}" >> "$GITHUB_OUTPUT"
          else
            arquivo=$(ls evals/relatorios/*.json 2>/dev/null | grep -v -- '-juiz' | head -n 1)
            echo "relatorio=$arquivo" >> "$GITHUB_OUTPUT"
          fi
      # O juiz leve (mais cota) julga todas as mensagens; o forte julga uma amostra de 40, e a
      # concordância entre os dois diz se dá para confiar nas métricas do leve.
      # Se um juiz falhar em mais de 20% dos julgamentos, o script sai com erro e o workflow fica vermelho.
      - name: Juiz automático
        id: juiz
        if: env.RODAR_JUIZ == 'true' && steps.rel.outputs.relatorio != ''
        timeout-minutes: 120
        run: python evals/juiz.py "${{ steps.rel.outputs.relatorio }}" --modelo gemini-3.5-flash-lite --paralelas 3 --intervalo 2
      - name: Juiz de conferência (amostra)
        id: conferencia
        if: always() && steps.juiz.outcome == 'success'
        timeout-minutes: 60
        run: python evals/juiz.py "${{ steps.rel.outputs.relatorio }}" --modelo gemini-3.8-flash --limite 40 --nome juiz-flash --paralelas 2 --intervalo 4
      - name: Concordância entre os juízes
        if: always() && steps.conferencia.outcome == 'success'
        run: |
          base="${{ steps.rel.outputs.relatorio }}"
          python evals/concordancia.py "${base%.json}-juiz.json" "${base%.json}-juiz-flash.json"
      - name: Resumo
        if: always() && steps.rel.outputs.relatorio != ''
        run: |
          base="${{ steps.rel.outputs.relatorio }}"
          head -n 16 "${base%.json}.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${base%.json}-juiz.md" ]; then echo >> "$GITHUB_STEP_SUMMARY"; head -n 10 "${base%.json}-juiz.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "${base%.json}-juiz-flash-concordancia.md" ]; then echo >> "$GITHUB_STEP_SUMMARY"; head -n 12 "${base%.json}-juiz-flash-concordancia.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-${{ env.ROTULO }}${{ env.JULGAR_EXECUCAO != '' && '-juiz' || '' }}-${{ github.run_number }}
          path: evals/relatorios/
          retention-days: 30
      - name: Resultado do tutor
        if: env.JULGAR_EXECUCAO == ''
        run: |
          test "${{ steps.tutor.outputs.codigo }}" = "0" || { echo "Houve vazamento: veja o relatório"; exit 1; }
