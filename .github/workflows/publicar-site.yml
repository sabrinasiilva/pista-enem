name: Publicar site

# Publica o front-end no GitHub Pages a cada mudança em web/ na main.
# O endereço da API vem da variável do repositório API_URL (Settings > Secrets and variables > Actions > Variables).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://pista-api.onrender.com' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
