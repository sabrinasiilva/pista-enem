name: App Android

# Gera o APK do Pista (o site empacotado com o Capacitor) e anexa na release.
# Roda quando uma release é publicada, ou à mão (Actions → App Android → Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag da release que recebe o APK, por exemplo v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      TAG: ${{ github.event.release.tag_name || inputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Build do site para o app
        run: npm run build:app
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://pista-api.onrender.com' }}
      - name: Projeto Android e ícones
        run: |
          npx cap add android
          mkdir -p assets
          cp public/icone-mascaravel-512.png assets/icon-only.png
          cp public/icone-mascaravel-512.png assets/icon-foreground.png
          cp public/icone-mascaravel-512.png assets/icon-background.png
          cp public/icone-mascaravel-512.png assets/splash.png
          cp public/icone-mascaravel-512.png assets/splash-dark.png
          npx --yes @capacitor/assets@4.0.0 generate --android --iconBackgroundColor '#1c1917' --splashBackgroundColor '#1c1917'
          npx cap sync android
      - name: Gera o APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Anexa na release
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pista.apk
          gh release upload "$TAG" pista.apk --clobber
