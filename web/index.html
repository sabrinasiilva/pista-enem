<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pista: tutor de Matemática e Ciências da Natureza para o ENEM que dá pistas, não respostas." />
    <meta name="theme-color" content="#1c1917" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pista · tutor socrático para o ENEM</title>
    <script>
      // aplica o tema escuro antes de desenhar a página, para não piscar branco
      try {
        var tema = localStorage.getItem('pista:tema')
        var escuro = tema === 'escuro' || (tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
