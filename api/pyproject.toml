[project]
name = "pista-api"
version = "0.1.0.dev0"
description = "API do Pista, tutor socrático com IA para o ENEM"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # assert é o jeito do pytest

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # chaves falsas nos testes
